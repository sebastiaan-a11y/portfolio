# nginx server-block voor de portfoliosite sebastiaan.viezee.nl.
# Komt naast de bestaande sites (wordpress, n8n, atom.viezee.nl).
#
# Plaats als: /etc/nginx/sites-available/sebastiaan.viezee.nl
# Activeer met een symlink naar sites-enabled (zie SETUP.md).
#
# BELANGRIJK (zelfde les als bij het Atom-platform): certbot voegt na de
# eerste run een 443-blok plus redirect toe. Zet die volledige live config
# daarna terug in dit bestand in de repo, en overschrijf de server-versie
# nooit blindweg met een oudere kopie. Bij twijfel eerst:
#   nginx -T | grep -A30 sebastiaan.viezee.nl

server {
    listen 80;
    server_name sebastiaan.viezee.nl;

    root /opt/portfolio;
    index index.html;

    # Publieke site: geen Basic Auth, geen backend, alleen statische bestanden.
    location / {
        try_files $uri $uri/ =404;
    }

    # Geen dotfiles of git-metadata serveren.
    location ~ /\. {
        deny all;
    }
}
